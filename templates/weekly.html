<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} | {{date}}</title>
<meta name="description" content="{{date}}全球汽车行业深度周报,涵盖中国、东南亚、南美、欧洲、北美等区域市场动态、政策变化、车企动态及注塑行业机会分析">
<meta name="keywords" content="汽车行业,周报,市场分析,注塑机,新能源,政策动态">
<meta name="author" content="数据分析助手">
<meta property="og:title" content="{{title}} | {{date}}">
<meta property="og:description" content="{{date}}全球汽车行业深度周报,涵盖中国、东南亚、南美、欧洲、北美等区域市场动态、政策变化、车企动态及注塑行业机会分析">
<meta property="og:type" content="article">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0a0f1e;
  --bg-secondary:#131a2e;
  --bg-tertiary:#1f2a44;
  --bg-card:rgba(26,34,54,.72);
  --accent-blue:#4d8dff;
  --accent-blue-light:#7fb0ff;
  --accent-orange:#ff8a3d;
  --accent-orange-dim:#b4551a;
  --accent-cyan:#22d3ee;
  --text-primary:#eef2fb;
  --text-secondary:#a7b0c3;
  --text-muted:#6b7688;
  --border-color:rgba(255,255,255,.08);
  --border-light:rgba(255,255,255,.16);
  --region-cn:#ff5c5c;
  --region-sea:#34d399;
  --region-sa:#fbbf24;
  --region-eu:#a78bfa;
  --region-na:#38bdf8;
  --region-other:#818cf8;
  --radius:12px;
  --radius-sm:8px;
  --shadow:0 12px 40px rgba(0,0,0,.4);
  --shadow-sm:0 6px 20px rgba(0,0,0,.25);
  --glow-blue:0 0 24px rgba(77,141,255,.35);
  --glow-orange:0 0 24px rgba(255,138,61,.3);
  --transition:all .25s cubic-bezier(.4,0,.2,1);

  --scroll-threshold:400;
  --nav-offset:100;
  --throttle-delay:100;
}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(circle at 15% 0%,rgba(77,141,255,.10),transparent 40%),
    radial-gradient(circle at 85% 10%,rgba(255,138,61,.08),transparent 35%),
    radial-gradient(circle at 50% 100%,rgba(34,211,238,.05),transparent 50%);
  background-attachment:fixed;
}
a{color:var(--accent-blue);text-decoration:none;transition:var(--transition)}
a:hover{text-decoration:underline;color:var(--accent-blue-light)}
a:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:2px}

/* Navigation */
.top-nav{
  position:sticky;top:0;z-index:1000;
  background:rgba(10,15,30,.78);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--border-color);
  padding:0 24px;
}
.nav-inner{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:6px;
  height:56px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav-brand{
  font-weight:800;font-size:14px;
  color:var(--accent-blue-light);
  white-space:nowrap;
  margin-right:16px;
  flex-shrink:0;
  display:flex;align-items:center;gap:6px;
  letter-spacing:.3px;
  background:linear-gradient(90deg,var(--accent-blue-light),var(--accent-cyan));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.nav-link{
  font-size:13px;color:var(--text-secondary);
  white-space:nowrap;padding:7px 12px;
  border-radius:8px;transition:var(--transition);
  flex-shrink:0;position:relative;
}
.nav-link:hover{color:var(--text-primary);background:var(--bg-secondary);text-decoration:none;transform:translateY(-1px)}
.nav-link.active{color:var(--accent-blue-light);background:rgba(77,141,255,.12)}
.nav-link.active::after{
  content:'';position:absolute;left:12px;right:12px;bottom:2px;height:2px;
  background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));
  border-radius:2px;
}

/* Hero */
.hero{
  position:relative;
  background:linear-gradient(135deg,#0a0f1e 0%,#131a2e 55%,#0f1526 100%);
  border-bottom:1px solid var(--border-color);
  padding:56px 24px 44px;
  text-align:center;
  overflow:hidden;
}
.hero::before{
  content:'';position:absolute;
  width:560px;height:560px;border-radius:50%;
  top:-260px;left:50%;transform:translateX(-50%);
  background:radial-gradient(circle,rgba(77,141,255,.18),transparent 60%);
  pointer-events:none;
}
.hero-inner{max-width:900px;margin:0 auto;position:relative;z-index:1}
.hero-badge{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12px;font-weight:700;
  color:var(--accent-blue-light);
  background:rgba(77,141,255,.12);
  border:1px solid rgba(77,141,255,.35);
  padding:5px 16px;border-radius:24px;
  margin-bottom:18px;letter-spacing:1px;
  box-shadow:var(--glow-blue);
}
.hero-badge::before{content:'◆';font-size:8px}
.hero h1{
  font-size:clamp(26px,4.5vw,40px);
  font-weight:800;
  line-height:1.25;
  margin-bottom:14px;
  letter-spacing:-.5px;
  background:linear-gradient(180deg,#fff 30%,#b9c8ef);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.hero-meta{
  font-size:14px;color:var(--text-secondary);
  display:flex;flex-wrap:wrap;justify-content:center;gap:20px;
}
.hero-meta span{
  white-space:nowrap;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border-color);
  padding:4px 12px;border-radius:8px;
  display:inline-flex;align-items:center;gap:6px;
}

/* Main container */
.container{max-width:1280px;margin:0 auto;padding:36px 24px}

/* Key Points Section */
.key-points{margin-bottom:52px}
.key-points-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:24px;
}
.key-points-header h2{
  font-size:20px;font-weight:800;
  color:var(--text-primary);
}
.key-points-header .line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-color),transparent)}
.kp-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:18px;
}
.kp-card{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:22px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  will-change:transform;
}
.kp-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);
}
.kp-card:hover{
  border-color:var(--border-light);
  box-shadow:var(--shadow);
  transform:translateY(-4px);
}
.kp-card .kp-num{
  font-size:38px;font-weight:800;
  color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.10);
  position:absolute;top:6px;right:16px;
  line-height:1;
  user-select:none;
}
.kp-card h3{
  font-size:15px;font-weight:700;
  line-height:1.5;
  margin-bottom:10px;
  padding-right:40px;
  color:var(--text-primary);
}
.kp-card p{
  font-size:13px;color:var(--text-secondary);
  line-height:1.75;
}
/* 原文链接按钮（全局：总览/市场/政策/车企/调研/注塑通用） */
.src-link{
  display:inline-flex;align-items:center;gap:4px;
  margin-top:10px;padding:4px 12px;border-radius:999px;
  font-size:12px;font-weight:500;color:#7cc8ff;
  background:rgba(124,200,255,.10);
  border:1px solid rgba(124,200,255,.32);
  text-decoration:none;cursor:pointer;
  transition:background .2s,border-color .2s,transform .2s,color .2s;
}
.src-link .src-link-ico{font-size:11px;line-height:1}
.src-link:hover{
  color:#fff;background:rgba(124,200,255,.20);
  border-color:rgba(124,200,255,.6);transform:translateY(-1px);
}
.kp-card.injection{
  border-color:rgba(255,138,61,.4);
  background:linear-gradient(135deg,rgba(255,138,61,.12),rgba(255,138,61,.03));
}
.kp-card.injection::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent-orange),#ffb26b);
}
.kp-card.injection:hover{box-shadow:var(--glow-orange)}
.kp-card.injection .kp-num{color:rgba(255,138,61,.25);-webkit-text-stroke:0}
.injection-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;
  color:var(--accent-orange);
  background:rgba(255,138,61,.14);
  border:1px solid rgba(255,138,61,.4);
  padding:3px 10px;border-radius:6px;
  margin-bottom:10px;
}

/* Overview - Data Cards (本周总览数据卡片) */
.overview-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:16px;
  margin-bottom:20px;
}
.overview-card{
  background:linear-gradient(160deg,rgba(26,34,54,.85),rgba(19,26,46,.6));
  backdrop-filter:blur(10px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:22px;
  position:relative;
  overflow:hidden;
  transition:var(--transition);
  min-height:120px;
}
.overview-card::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:linear-gradient(90deg,var(--accent-blue),transparent);
  opacity:.7;
}
.overview-card:hover{
  border-color:var(--border-light);
  transform:translateY(-4px);
  box-shadow:var(--shadow);
}
.overview-card .card-number{
  font-size:42px;font-weight:800;
  line-height:1;
  background:linear-gradient(180deg,var(--accent-blue-light),var(--accent-blue));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  margin-bottom:12px;
  display:block;
}
.overview-card .overview-card-title{
  font-size:16px;font-weight:700;
  line-height:1.5;
  color:var(--text-primary);
  margin-bottom:8px;
}
.overview-card .overview-card-desc{
  font-size:13px;
  color:var(--text-secondary);
  line-height:1.7;
  margin:0;
}
.core-highlights{
  margin-top:8px;
}
.core-highlights h3{
  font-size:16px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:14px;
}
.core-highlights ul,.core-highlights ol{
  list-style:none;padding:0;margin:0;
}
.core-highlights li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding:10px 0 10px 18px;
  position:relative;
  border-bottom:1px solid var(--border-color);
}
.core-highlights li:last-child{border-bottom:none}
.core-highlights li::before{
  content:'◆';position:absolute;left:0;top:10px;
  color:var(--accent-blue);font-size:10px;
}

/* Markets - Region Cards (各地市场卡片，与政策/车企一致) */
.markets-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(340px,1fr));
  gap:16px;
  margin-bottom:8px;
}
.region-card{
  background:var(--bg-card);
  backdrop-filter:blur(10px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
}
.region-card::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--region-color,var(--accent-blue));
  border-radius:3px 0 0 3px;
}
.region-card:hover{
  border-color:var(--border-light);
  transform:translateY(-3px);
  box-shadow:var(--shadow);
}
.region-card .region-tag{
  font-size:15px;font-weight:700;
  color:var(--region-color,var(--text-primary));
  margin-bottom:10px;
  padding-left:12px;
  display:flex;align-items:center;gap:8px;
}
.region-card .region-tag::before{
  content:'';width:8px;height:8px;border-radius:50%;
  background:var(--region-color,var(--region-cn));
  box-shadow:0 0 8px var(--region-color,var(--region-cn));
  flex-shrink:0;
}
.region-card .region-content p{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding-left:12px;
  margin:0;
}
.region-card .region-content{
  display:contents;
}
.region-card.region-cn{--region-color:var(--region-cn)}
.region-card.region-na{--region-color:var(--region-na)}
.region-card.region-eu{--region-color:var(--region-eu)}
.region-card.region-sea{--region-color:var(--region-sea)}
.region-card.region-sa{--region-color:var(--region-sa)}
.region-card.region-in{--region-color:#f472b6}
.region-card.region-ru{--region-color:#fb7185}
.region-card.region-au{--region-color:#2dd4bf}
.region-card.region-jp{--region-color:#e879f9}

/* Section */
.section{margin-bottom:52px}
.section-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:24px;
  padding-bottom:12px;
  border-bottom:1px solid var(--border-color);
}
.section-header h2{
  font-size:22px;font-weight:800;
  color:var(--text-primary);
  white-space:nowrap;
  background:linear-gradient(90deg,var(--text-primary),var(--text-secondary));
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.section-header .sec-line{flex:1;height:1px;background:linear-gradient(90deg,var(--border-color),transparent)}
.section-header .sec-num{
  font-size:12px;font-weight:700;
  color:var(--accent-blue-light);
  background:rgba(77,141,255,.12);
  border:1px solid rgba(77,141,255,.3);
  padding:4px 12px;border-radius:6px;
  letter-spacing:.5px;
}

/* Subsection */
.subsection{margin-bottom:34px}
.subsection-title{
  display:flex;align-items:center;gap:8px;
  font-size:17px;font-weight:700;
  margin-bottom:16px;
  padding-left:12px;
  border-left:3px solid var(--accent-blue);
}
.subsection-title .region-dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;
  box-shadow:0 0 8px currentColor;
}

/* News card */
.news-card{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  transition:var(--transition);
  position:relative;
}
.news-card:hover{
  border-color:var(--border-light);
  transform:translateX(3px);
  box-shadow:var(--shadow-sm);
}
.news-card h4{
  font-size:15px;font-weight:700;
  line-height:1.6;
  margin-bottom:10px;
  color:var(--text-primary);
}
.news-card .news-body{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  margin-bottom:10px;
}
.news-card .news-body strong{color:var(--text-primary)}
/* ---- 三要点结构化（关键数据/影响分析/趋势判断） ---- */
.news-body .points-block{
  display:flex;flex-direction:column;gap:8px;
}
.point{
  display:flex;align-items:flex-start;gap:8px;
  padding:7px 10px;
  border-radius:8px;
  background:rgba(255,255,255,.035);
  border-left:3px solid rgba(255,255,255,.18);
  font-size:13px;line-height:1.65;
  color:var(--text-secondary);
}
.point .point-head{
  flex:0 0 auto;
  font-weight:700;
  font-size:12px;
  letter-spacing:.3px;
  padding:1px 7px;
  border-radius:5px;
  white-space:nowrap;
  color:var(--text-primary);
}
.point .point-text{flex:1 1 auto}
.point-key{background:rgba(0,210,255,.05);border-left-color:var(--accent-blue)}
.point-key .point-head{background:rgba(0,210,255,.14);color:#7fe7ff}
.point-impact{background:rgba(255,184,0,.05);border-left-color:#ffb800}
.point-impact .point-head{background:rgba(255,184,0,.13);color:#ffd166}
.point-trend{background:rgba(80,220,140,.05);border-left-color:#50dc8c}
.point-trend .point-head{background:rgba(80,220,140,.13);color:#7ff0b0}
.news-source{
  font-size:12px;color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
}
.news-source::before{
  content:'';display:inline-block;
  width:4px;height:4px;border-radius:50%;
  background:var(--text-muted);
}
/* 卡片底部：数据来源 + 原文按钮 横排 */
.news-foot{
  display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin-top:8px;padding-top:8px;
  border-top:1px dashed rgba(255,255,255,.08);
}
.news-foot .news-source{font-size:12px;color:var(--text-muted)}
.news-foot .src-link{margin:0}
.news-card ul{
  list-style:none;padding:0;margin:8px 0;
}
.news-card ul li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding-left:16px;
  position:relative;
}
.news-card ul li::before{
  content:'•';position:absolute;left:0;
  color:var(--accent-blue);font-weight:700;
}

/* Region colors */
.region-cn .subsection-title{border-left-color:var(--region-cn)}
.region-cn .subsection-title{color:var(--region-cn)}
.region-cn .region-dot{background:var(--region-cn);color:var(--region-cn)}
.region-sea .subsection-title{border-left-color:var(--region-sea)}
.region-sea .subsection-title{color:var(--region-sea)}
.region-sea .region-dot{background:var(--region-sea);color:var(--region-sea)}
.region-sa .subsection-title{border-left-color:var(--region-sa)}
.region-sa .subsection-title{color:var(--region-sa)}
.region-sa .region-dot{background:var(--region-sa);color:var(--region-sa)}
.region-eu .subsection-title{border-left-color:var(--region-eu)}
.region-eu .subsection-title{color:var(--region-eu)}
.region-eu .region-dot{background:var(--region-eu);color:var(--region-eu)}
.region-na .subsection-title{border-left-color:var(--region-na)}
.region-na .subsection-title{color:var(--region-na)}
.region-na .region-dot{background:var(--region-na);color:var(--region-na)}
.region-other .subsection-title{border-left-color:var(--region-other)}
.region-other .subsection-title{color:var(--region-other)}
.region-other .region-dot{background:var(--region-other);color:var(--region-other)}

/* Policy section */
.policy-card{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  transition:var(--transition);
  position:relative;
}
.policy-card::before{
  content:'🏛';position:absolute;top:16px;right:18px;font-size:20px;opacity:.4;
}
.policy-card:hover{border-color:rgba(77,141,255,.4);transform:translateY(-2px)}
.policy-card h3{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:10px;
  padding-right:32px;
}
.policy-card p{font-size:14px;color:var(--text-secondary);line-height:1.8}

/* OEM section */
.oem-card{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  transition:var(--transition);
}
.oem-card:hover{border-color:rgba(77,141,255,.4);transform:translateY(-2px)}
.oem-card h3{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.oem-card h3 .oem-tag{
  font-size:11px;font-weight:600;
  color:var(--accent-blue-light);
  background:rgba(77,141,255,.14);
  border:1px solid rgba(77,141,255,.3);
  padding:2px 10px;border-radius:5px;
}
.oem-card p,.oem-card li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
}
.oem-card ul{list-style:none;padding:0;margin:8px 0}
.oem-card ul li{padding-left:16px;position:relative}
.oem-card ul li::before{content:'→';position:absolute;left:0;color:var(--accent-blue)}

/* Injection opportunity section */
.injection-section{
  background:linear-gradient(135deg,rgba(255,138,61,.10),rgba(255,138,61,.02));
  border:1px solid rgba(255,138,61,.3);
  border-radius:16px;
  padding:26px;
  margin-bottom:52px;
  box-shadow:inset 0 0 40px rgba(255,138,61,.04);
}
.injection-section .section-header{border-bottom-color:rgba(255,138,61,.35)}
.injection-section .section-header h2{background:linear-gradient(90deg,var(--accent-orange),#ffb26b);-webkit-background-clip:text;background-clip:text;color:transparent}
.inj-card{
  background:rgba(10,15,30,.55);
  backdrop-filter:blur(8px);
  border:1px solid rgba(255,138,61,.2);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:16px;
  position:relative;
  transition:var(--transition);
}
.inj-card:hover{transform:translateX(3px);box-shadow:var(--glow-orange)}
.inj-card::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--accent-orange),#ffb26b);
  border-radius:3px 0 0 3px;
}
.inj-card h3{
  font-size:15px;font-weight:700;
  color:var(--accent-orange);
  margin-bottom:10px;
  padding-left:12px;
}
.inj-card p{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding-left:12px;
}

/* Research section */
.research-card{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:18px;
  transition:var(--transition);
}
.research-card:hover{border-color:rgba(167,139,250,.4);transform:translateY(-2px)}
.research-card h3{
  font-size:16px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:12px;
}
.research-card p{font-size:14px;color:var(--text-secondary);line-height:1.85}

/* Next week */
.next-week{
  background:var(--bg-card);
  backdrop-filter:blur(8px);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:26px;
  position:relative;
  overflow:hidden;
}
.next-week::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent-blue),var(--accent-cyan));
}
.next-week ul{list-style:none;padding:0}
.next-week ul li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding:10px 0;
  border-bottom:1px solid var(--border-color);
  display:flex;align-items:flex-start;gap:12px;
  transition:var(--transition);
}
.next-week ul li:hover{padding-left:6px;color:var(--text-primary)}
.next-week ul li:last-child{border-bottom:none}
.next-week ul li::before{
  content:'📌';flex-shrink:0;font-size:13px;
}
.next-week ul li strong{color:var(--text-primary)}

/* Footer */
.footer{
  border-top:1px solid var(--border-color);
  padding:36px 24px;
  text-align:center;
  background:rgba(10,15,30,.5);
}
.footer p{font-size:12px;color:var(--text-muted);line-height:1.9}

/* Back to top */
.back-top{
  position:fixed;bottom:28px;right:28px;
  width:44px;height:44px;
  background:linear-gradient(135deg,var(--accent-blue),var(--accent-cyan));
  border:none;border-radius:12px;
  color:#fff;font-size:18px;
  cursor:pointer;
  opacity:0;visibility:hidden;
  transition:var(--transition);
  z-index:999;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 6px 20px rgba(77,141,255,.45);
  will-change:transform;
}
.back-top.visible{opacity:1;visibility:visible}
.back-top:hover{transform:translateY(-3px) scale(1.05);box-shadow:0 8px 28px rgba(77,141,255,.6)}

/* Scroll reveal */
.reveal{opacity:0;transform:translateY(24px);transition:opacity .6s ease,transform .6s ease}
.reveal.visible{opacity:1;transform:translateY(0)}

/* Responsive */
@media(max-width:768px){
  .hero{padding:40px 16px 28px}
  .hero h1{font-size:24px}
  .hero-meta{font-size:12px;gap:8px}
  .container{padding:24px 16px}
  .kp-grid{grid-template-columns:1fr}
  .section-header h2{font-size:18px}
  .subsection-title{font-size:15px}
  .news-card{padding:16px}
  .injection-section{padding:18px}
  .nav-brand{font-size:12px;margin-right:8px}
  .nav-link{font-size:12px;padding:5px 8px}
}
@media(max-width:480px){
  body{font-size:15px}
  .hero h1{font-size:21px}
  .kp-card{padding:16px}
  .kp-card h3{font-size:14px}
  .news-card h4{font-size:14px}
}

/* Print */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
  .reveal{opacity:1;transform:none}
}
@media print{
  .top-nav,.back-top{display:none!important}
  body{background:#fff;color:#111;font-size:12px}
  .hero{background:#fff;border-bottom:2px solid #111;padding:20px 0}
  .hero h1{color:#111;-webkit-text-fill-color:#111}
  .hero-meta{color:#444}
  .container{padding:16px 0}
  .kp-card,.news-card,.policy-card,.oem-card,.inj-card,.research-card,.next-week{
    background:#fff;border:1px solid #ddd;color:#111;
    break-inside:avoid;
  }
  .kp-card h3,.news-card h4,.policy-card h4,.oem-card h4,.inj-card h4,.research-card h4{color:#111}
  .kp-card p,.news-card .news-body,.policy-card p,.oem-card p,.inj-card p,.research-card p{color:#333}
  .news-source{color:#666}
  .section{break-inside:avoid}
  .injection-section{background:#fff;border-color:#f97316}
  a{color:#111;text-decoration:underline}
  a[href]::after{content:" (" attr(href) ")";font-size:10px;color:#666}
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="top-nav" role="navigation" aria-label="页面导航">
<div class="nav-inner">
  <span class="nav-brand">🚗 汽车周报</span>
  <a href="#overview" class="nav-link" title="本周总览">本周总览</a>
  <a href="#china" class="nav-link" title="中国市场">中国</a>
  <a href="#sea" class="nav-link" title="东南亚市场">东南亚</a>
  <a href="#sa" class="nav-link" title="南美市场">南美</a>
  <a href="#eu" class="nav-link" title="欧洲市场">欧洲</a>
  <a href="#na" class="nav-link" title="北美市场">北美</a>
  <a href="#other" class="nav-link" title="其他市场">其他市场</a>
  <a href="#policy" class="nav-link" title="政策动态">政策</a>
  <a href="#oem" class="nav-link" title="车企动态">车企</a>
  <a href="#research" class="nav-link" title="调研报告">调研</a>
  <a href="#injection" class="nav-link" style="color:var(--accent-orange)" title="注塑机会">⚡注塑机会</a>
  <a href="#nextweek" class="nav-link" title="下周关注">下周</a>
</div>
</nav>

<!-- Hero -->
<header class="hero" id="top">
<div class="hero-inner">
  <span class="hero-badge">WEEKLY REPORT</span>
  <h1>全球汽车行业周报</h1>
  <div class="hero-meta">
    <span>📅 {{date}}</span>
    <span>📊 {{data_period}}</span>
    <span>🏢 编制：{{team}}</span>
  </div>
</div>
</header>

<main class="container">

<!-- Key Points -->
{{overview}}
{{markets}}
{{policy}}
{{oem}}
{{research}}
{{injection}}
{{nextweek}}</main>

<!-- Footer -->
<footer class="footer">
  <p><strong>数据来源：</strong>{{sources}}</p>
  <p style="margin-top:8px">本报告仅供内部参考，数据以各官方机构发布为准。</p>
  <p style="margin-top:12px;color:var(--text-muted)">© 2026 {{title}} | {{date}}</p>
</footer>

<!-- Back to top button -->
<button type="button" class="back-top" id="backTop" aria-label="返回顶部" title="返回顶部">↑</button>

<script>
// Configuration constants
const CONSTANTS = {
  SCROLL_THRESHOLD: 400,
  NAV_OFFSET: 100,
  THROTTLE_DELAY: 100
};

// Throttle utility function
function throttle(func, delay) {
  let lastCall = 0;
  return function(...args) {
    const now = Date.now();
    if (now - lastCall >= delay) {
      lastCall = now;
      func.apply(this, args);
    }
  };
}

// Back to top visibility handler
function handleBackTopVisibility() {
  const btn = document.getElementById('backTop');
  if (window.scrollY > CONSTANTS.SCROLL_THRESHOLD) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}

// Active nav highlight handler
function handleNavHighlight() {
  const sections = document.querySelectorAll('[id]');
  const navLinks = document.querySelectorAll('.nav-link');
  const scrollPos = window.scrollY + CONSTANTS.NAV_OFFSET;

  sections.forEach(function(sec) {
    if (sec.offsetTop <= scrollPos && (sec.offsetTop + sec.offsetHeight) > scrollPos) {
      const id = sec.getAttribute('id');
      navLinks.forEach(function(link) {
        link.classList.remove('active');
        if (link.getAttribute('href') === '#' + id) {
          link.classList.add('active');
        }
      });
    }
  });
}

// Scroll reveal for sections
function handleReveal() {
  const els = document.querySelectorAll('.reveal:not(.visible)');
  const vh = window.innerHeight;
  els.forEach(function(el) {
    const rect = el.getBoundingClientRect();
    if (rect.top < vh - 60) {
      el.classList.add('visible');
    }
  });
}

// Apply throttled scroll handlers
const throttledBackTopHandler = throttle(handleBackTopVisibility, CONSTANTS.THROTTLE_DELAY);
const throttledNavHandler = throttle(handleNavHighlight, CONSTANTS.THROTTLE_DELAY);
const throttledRevealHandler = throttle(handleReveal, CONSTANTS.THROTTLE_DELAY);

// Attach scroll event listeners
window.addEventListener('scroll', throttledBackTopHandler);
window.addEventListener('scroll', throttledNavHandler);
window.addEventListener('scroll', throttledRevealHandler);

// Smooth scroll for nav links
document.querySelectorAll('a[href^="#"]').forEach(function(a) {
  a.addEventListener('click', function(e) {
    const id = this.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) {
      e.preventDefault();
      el.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
});

// Back to top button click handler
document.getElementById('backTop').addEventListener('click', function() {
  window.scrollTo({top: 0, behavior: 'smooth'});
});

// Init reveal on load and add reveal class to top-level sections
document.addEventListener('DOMContentLoaded', function() {
  // If page uses .reveal, apply to direct section children of main
  document.querySelectorAll('main > .section, main > .key-points, main > .injection-section').forEach(function(el) {
    if (!el.classList.contains('reveal')) {
      el.classList.add('reveal');
    }
  });
  handleReveal();
});
</script>

</body>
