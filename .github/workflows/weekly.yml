name: 生成汽车行业周报并推送

on:
  schedule:
    # 每周一 10:35 CST (02:35 UTC)
    - cron: "35 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      # 完整流水线：Bot抓文本 → md转agent.html → 渲染index.html → 注入配图 → 推送企微
      - name: Run weekly report pipeline
        env:
          COZE_WORKLOAD_API_TOKEN: ${{ secrets.COZE_WORKLOAD_API_TOKEN }}
          COZE_BOT_ID: ${{ secrets.COZE_BOT_ID }}
          COZE_API_BASE_URL: ${{ secrets.COZE_API_BASE_URL || 'https://api.coze.cn' }}
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
        run: |
          python scripts/run_pipeline.py
          echo "=== index.html 配图数 ==="
          grep -c '<img' index.html || true
          echo "=== index.html 原文链接数 ==="
          grep -c 'class="src-link"' index.html || true

      # run_pipeline.py 内部已处理企微推送（缺 key 时自动跳过），无需单独 fallback，避免重复推送。
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html weekly_*.md
          git commit -m "auto: $(date +%Y-%m-%d) 汽车行业周报" || echo "No changes to commit"
          git pull origin main --rebase --autostash || true
          git push