name: 生成汽车行业周报并推送

on:
  schedule:
    # 每周一 10:35 CST (02:35 UTC)
    - cron: "35 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Generate weekly report HTML from Agent
        env:
          COZE_WORKLOAD_API_TOKEN: ${{ secrets.COZE_WORKLOAD_API_TOKEN }}
          COZE_BOT_ID: ${{ secrets.COZE_BOT_ID }}
          COZE_API_BASE_URL: ${{ secrets.COZE_API_BASE_URL || 'https://api.coze.cn' }}
        run: |
          python scripts/generate_weekly.py
          echo "=== index.html first 500 chars ==="
          head -c 500 index.html
          echo ""
          echo "=== index.html last 500 chars ==="
          tail -c 500 index.html

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "auto: $(date +%Y-%m-%d) 汽车行业周报" || echo "No changes to commit"
          git pull origin main --rebase --autostash || true
          git push

      - name: Wait for GitHub Pages deployment
        run: |
          echo "Waiting for GitHub Pages to deploy..."
          sleep 180

      - name: Send WeCom notification
        env:
          WECOM_WEBHOOK_KEY: ${{ secrets.WECOM_WEBHOOK_KEY }}
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_REPO: ${{ github.event.repository.name }}
        run: python scripts/send_wecom.py
