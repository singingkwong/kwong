<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}} | {{date}}</title>
<meta name="description" content="{{date}}全球汽车行业深度周报,涵盖中国、东南亚、南美、欧洲、北美等区域市场动态、政策变化、车企动态及注塑行业机会分析">
<meta name="keywords" content="汽车行业,周报,市场分析,注塑机,新能源,政策动态">
<meta name="author" content="数据分析助手">
<meta property="og:title" content="{{title}} | {{date}}">
<meta property="og:description" content="{{date}}全球汽车行业深度周报,涵盖中国、东南亚、南美、欧洲、北美等区域市场动态、政策变化、车企动态及注塑行业机会分析">
<meta property="og:type" content="article">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-primary:#0f172a;
  --bg-secondary:#1e293b;
  --bg-tertiary:#334155;
  --bg-card:#1a2236;
  --accent-blue:#3b82f6;
  --accent-orange:#f97316;
  --accent-orange-dim:#92400e;
  --text-primary:#f1f5f9;
  --text-secondary:#94a3b8;
  --text-muted:#64748b;
  --border-color:#334155;
  --border-light:#475569;
  --region-cn:#ef4444;
  --region-sea:#10b981;
  --region-sa:#eab308;
  --region-eu:#8b5cf6;
  --region-na:#06b6d4;
  --region-other:#6366f1;
  --radius:8px;
  --shadow:0 4px 24px rgba(0,0,0,.3);
  --transition:all .2s ease;
  
  /* Constants for JavaScript */
  --scroll-threshold:400;
  --nav-offset:100;
  --throttle-delay:100;
}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg-primary);
  color:var(--text-primary);
  line-height:1.75;
  font-size:16px;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent-blue);text-decoration:none;transition:var(--transition)}
a:hover{text-decoration:underline;color:#60a5fa}
a:focus-visible{outline:2px solid var(--accent-blue);outline-offset:2px;border-radius:2px}

/* Navigation */
.top-nav{
  position:sticky;top:0;z-index:1000;
  background:rgba(15,23,42,.92);
  backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-color);
  padding:0 24px;
}
.nav-inner{
  max-width:1280px;margin:0 auto;
  display:flex;align-items:center;gap:8px;
  height:56px;
  overflow-x:auto;
  scrollbar-width:none;
}
.nav-inner::-webkit-scrollbar{display:none}
.nav-brand{
  font-weight:700;font-size:14px;
  color:var(--accent-blue);
  white-space:nowrap;
  margin-right:16px;
  flex-shrink:0;
}
.nav-link{
  font-size:13px;color:var(--text-secondary);
  white-space:nowrap;padding:6px 12px;
  border-radius:6px;transition:var(--transition);
  flex-shrink:0;
}
.nav-link:hover{color:var(--text-primary);background:var(--bg-secondary);text-decoration:none}
.nav-link.active{color:var(--accent-blue);background:rgba(59,130,246,.1)}

/* Hero */
.hero{
  background:linear-gradient(135deg,#0f172a 0%,#1e293b 50%,#0f172a 100%);
  border-bottom:1px solid var(--border-color);
  padding:48px 24px 40px;
  text-align:center;
}
.hero-inner{max-width:900px;margin:0 auto}
.hero-badge{
  display:inline-block;
  font-size:12px;font-weight:600;
  color:var(--accent-blue);
  background:rgba(59,130,246,.12);
  border:1px solid rgba(59,130,246,.3);
  padding:4px 14px;border-radius:20px;
  margin-bottom:16px;letter-spacing:.5px;
}
.hero h1{
  font-size:clamp(24px,4vw,36px);
  font-weight:800;
  line-height:1.3;
  margin-bottom:12px;
  letter-spacing:-.5px;
}
.hero-meta{
  font-size:14px;color:var(--text-muted);
  display:flex;flex-wrap:wrap;justify-content:center;gap:16px;
}
.hero-meta span{white-space:nowrap}

/* Main container */
.container{max-width:1280px;margin:0 auto;padding:32px 24px}

/* Key Points Section */
.key-points{margin-bottom:48px}
.key-points-header{
  display:flex;align-items:center;gap:10px;
  margin-bottom:24px;
}
.key-points-header h2{
  font-size:20px;font-weight:700;
  color:var(--text-primary);
}
.key-points-header .line{flex:1;height:1px;background:var(--border-color)}
.kp-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(320px,1fr));
  gap:16px;
}
.kp-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  transition:var(--transition);
  position:relative;
  overflow:hidden;
  will-change:transform;
}
.kp-card:hover{
  border-color:var(--border-light);
  box-shadow:var(--shadow);
}
.kp-card:hover{
  transform:translateY(-2px);
}
.kp-card .kp-num{
  font-size:32px;font-weight:800;
  color:var(--bg-tertiary);
  position:absolute;top:8px;right:14px;
  line-height:1;
}
.kp-card h3{
  font-size:15px;font-weight:700;
  line-height:1.5;
  margin-bottom:10px;
  padding-right:40px;
  color:var(--text-primary);
}
.kp-card p{
  font-size:13px;color:var(--text-secondary);
  line-height:1.7;
}
.kp-card.injection{
  border-color:var(--accent-orange);
  background:linear-gradient(135deg,rgba(249,115,22,.06),rgba(249,115,22,.02));
}
.kp-card.injection::before{
  content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--accent-orange),#fb923c);
}
.kp-card.injection .kp-num{color:rgba(249,115,22,.2)}
.injection-badge{
  display:inline-flex;align-items:center;gap:4px;
  font-size:11px;font-weight:700;
  color:var(--accent-orange);
  background:rgba(249,115,22,.12);
  border:1px solid rgba(249,115,22,.3);
  padding:2px 8px;border-radius:4px;
  margin-bottom:8px;
}

/* Section */
.section{margin-bottom:48px}
.section-header{
  display:flex;align-items:center;gap:12px;
  margin-bottom:24px;
  padding-bottom:12px;
  border-bottom:2px solid var(--border-color);
}
.section-header h2{
  font-size:22px;font-weight:800;
  color:var(--text-primary);
  white-space:nowrap;
}
.section-header .sec-line{flex:1;height:1px;background:var(--border-color)}
.section-header .sec-num{
  font-size:12px;font-weight:700;
  color:var(--text-muted);
  background:var(--bg-secondary);
  padding:4px 10px;border-radius:4px;
}

/* Subsection */
.subsection{margin-bottom:32px}
.subsection-title{
  display:flex;align-items:center;gap:8px;
  font-size:17px;font-weight:700;
  margin-bottom:16px;
  padding-left:12px;
  border-left:3px solid var(--accent-blue);
}
.subsection-title .region-dot{
  width:10px;height:10px;border-radius:50%;
  flex-shrink:0;
}

/* News card */
.news-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
  transition:var(--transition);
}
.news-card:hover{border-color:var(--border-light)}
.news-card h4{
  font-size:15px;font-weight:700;
  line-height:1.6;
  margin-bottom:10px;
  color:var(--text-primary);
}
.news-card .news-body{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  margin-bottom:10px;
}
.news-card .news-body strong{color:var(--text-primary)}
.news-source{
  font-size:12px;color:var(--text-muted);
  display:flex;align-items:center;gap:6px;
}
.news-source::before{
  content:'';display:inline-block;
  width:4px;height:4px;border-radius:50%;
  background:var(--text-muted);
}
.news-card ul{
  list-style:none;padding:0;margin:8px 0;
}
.news-card ul li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding-left:16px;
  position:relative;
}
.news-card ul li::before{
  content:'•';position:absolute;left:0;
  color:var(--accent-blue);font-weight:700;
}

/* Region colors */
.region-cn .subsection-title{border-left-color:var(--region-cn)}
.region-cn .region-dot{background:var(--region-cn)}
.region-sea .subsection-title{border-left-color:var(--region-sea)}
.region-sea .region-dot{background:var(--region-sea)}
.region-sa .subsection-title{border-left-color:var(--region-sa)}
.region-sa .region-dot{background:var(--region-sa)}
.region-eu .subsection-title{border-left-color:var(--region-eu)}
.region-eu .region-dot{background:var(--region-eu)}
.region-na .subsection-title{border-left-color:var(--region-na)}
.region-na .region-dot{background:var(--region-na)}
.region-other .subsection-title{border-left-color:var(--region-other)}
.region-other .region-dot{background:var(--region-other)}

/* Policy section */
.policy-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
}
.policy-card h3{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:10px;
}
.policy-card p{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
}

/* OEM section */
.oem-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
}
.oem-card h3{
  font-size:15px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:10px;
  display:flex;align-items:center;gap:8px;
}
.oem-card h3 .oem-tag{
  font-size:11px;font-weight:600;
  color:var(--accent-blue);
  background:rgba(59,130,246,.1);
  padding:2px 8px;border-radius:4px;
}
.oem-card p,.oem-card li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
}
.oem-card ul{list-style:none;padding:0;margin:8px 0}
.oem-card ul li{padding-left:16px;position:relative}
.oem-card ul li::before{content:'→';position:absolute;left:0;color:var(--accent-blue)}

/* Injection opportunity section */
.injection-section{
  background:linear-gradient(135deg,rgba(249,115,22,.04),rgba(249,115,22,.01));
  border:1px solid rgba(249,115,22,.2);
  border-radius:12px;
  padding:24px;
  margin-bottom:48px;
}
.injection-section .section-header{
  border-bottom-color:rgba(249,115,22,.3);
}
.injection-section .section-header h2{color:var(--accent-orange)}
.inj-card{
  background:rgba(15,23,42,.6);
  border:1px solid rgba(249,115,22,.15);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:14px;
  position:relative;
}
.inj-card::before{
  content:'';position:absolute;top:0;left:0;bottom:0;width:3px;
  background:var(--accent-orange);border-radius:3px 0 0 3px;
}
.inj-card h3{
  font-size:15px;font-weight:700;
  color:var(--accent-orange);
  margin-bottom:10px;
  padding-left:12px;
}
.inj-card p{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding-left:12px;
}

/* Research section */
.research-card{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:24px;
  margin-bottom:16px;
}
.research-card h3{
  font-size:16px;font-weight:700;
  color:var(--text-primary);
  margin-bottom:12px;
}
.research-card p{
  font-size:14px;color:var(--text-secondary);
  line-height:1.85;
}

/* Next week */
.next-week{
  background:var(--bg-card);
  border:1px solid var(--border-color);
  border-radius:var(--radius);
  padding:24px;
}
.next-week ul{list-style:none;padding:0}
.next-week ul li{
  font-size:14px;color:var(--text-secondary);
  line-height:1.8;
  padding:8px 0;
  border-bottom:1px solid var(--border-color);
  display:flex;align-items:flex-start;gap:10px;
}
.next-week ul li:last-child{border-bottom:none}
.next-week ul li::before{
  content:'📌';flex-shrink:0;font-size:12px;
}
.next-week ul li strong{color:var(--text-primary)}

/* Footer */
.footer{
  border-top:1px solid var(--border-color);
  padding:32px 24px;
  text-align:center;
}
.footer p{font-size:12px;color:var(--text-muted);line-height:1.8}

/* Back to top */
.back-top{
  position:fixed;bottom:24px;right:24px;
  width:40px;height:40px;
  background:var(--accent-blue);
  border:none;border-radius:50%;
  color:#fff;font-size:18px;
  cursor:pointer;
  opacity:0;visibility:hidden;
  transition:var(--transition);
  z-index:999;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(59,130,246,.4);
  will-change:transform;
}
.back-top.visible{opacity:1;visibility:visible}
.back-top:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(59,130,246,.5)}

/* Responsive */
@media(max-width:768px){
  .hero{padding:32px 16px 24px}
  .hero h1{font-size:22px}
  .hero-meta{font-size:12px;gap:8px}
  .container{padding:20px 16px}
  .kp-grid{grid-template-columns:1fr}
  .section-header h2{font-size:18px}
  .subsection-title{font-size:15px}
  .news-card{padding:16px}
  .injection-section{padding:16px}
  .nav-brand{font-size:12px;margin-right:8px}
  .nav-link{font-size:12px;padding:4px 8px}
}
@media(max-width:480px){
  body{font-size:15px}
  .hero h1{font-size:20px}
  .kp-card{padding:16px}
  .kp-card h3{font-size:14px}
  .news-card h4{font-size:14px}
}

/* Print */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}
@media print{
  .top-nav,.back-top{display:none!important}
  body{background:#fff;color:#111;font-size:12px}
  .hero{background:#fff;border-bottom:2px solid #111;padding:20px 0}
  .hero h1{color:#111}
  .hero-meta{color:#444}
  .container{padding:16px 0}
  .kp-card,.news-card,.policy-card,.oem-card,.inj-card,.research-card,.next-week{
    background:#fff;border:1px solid #ddd;color:#111;
    break-inside:avoid;
  }
  .kp-card h3,.news-card h4,.policy-card h4,.oem-card h4,.inj-card h4,.research-card h4{color:#111}
  .kp-card p,.news-card .news-body,.policy-card p,.oem-card p,.inj-card p,.research-card p{color:#333}
  .news-source{color:#666}
  .section{break-inside:avoid}
  .injection-section{background:#fff;border-color:#f97316}
  a{color:#111;text-decoration:underline}
  a[href]::after{content:" (" attr(href) ")";font-size:10px;color:#666}
}
</style>
</head>
<body>

<!-- Navigation -->
<nav class="top-nav" role="navigation" aria-label="页面导航">
<div class="nav-inner">

<!-- Back to top button -->
<button type="button" class="back-top" id="backTop" aria-label="返回顶部" title="返回顶部">↑</button>

<script>
// Configuration constants
const CONSTANTS = {
  SCROLL_THRESHOLD: 400,
  NAV_OFFSET: 100,
  THROTTLE_DELAY: 100
};

// Throttle utility function
function throttle(func, delay) {
  let lastCall = 0;
  return function(...args) {
    const now = Date.now();
    if (now - lastCall >= delay) {
      lastCall = now;
      func.apply(this, args);
    }
  };
}

// Back to top visibility handler
function handleBackTopVisibility() {
  const btn = document.getElementById('backTop');
  if (window.scrollY > CONSTANTS.SCROLL_THRESHOLD) {
    btn.classList.add('visible');
  } else {
    btn.classList.remove('visible');
  }
}

// Active nav highlight handler
function handleNavHighlight() {
  const sections = document.querySelectorAll('[id]');
  const navLinks = document.querySelectorAll('.nav-link');
  const scrollPos = window.scrollY + CONSTANTS.NAV_OFFSET;
  
  sections.forEach(function(sec) {
    if (sec.offsetTop <= scrollPos && (sec.offsetTop + sec.offsetHeight) > scrollPos) {
      const id = sec.getAttribute('id');
      navLinks.forEach(function(link) {
        link.classList.remove('active');
        if (link.getAttribute('href') === '#' + id) {
          link.classList.add('active');
        }
      });
    }
  });
}

// Apply throttled scroll handlers
const throttledBackTopHandler = throttle(handleBackTopVisibility, CONSTANTS.THROTTLE_DELAY);
const throttledNavHandler = throttle(handleNavHighlight, CONSTANTS.THROTTLE_DELAY);

// Attach scroll event listeners
window.addEventListener('scroll', throttledBackTopHandler);
window.addEventListener('scroll', throttledNavHandler);

// Smooth scroll for nav links
document.querySelectorAll('a[href^="#"]').forEach(function(a) {
  a.addEventListener('click', function(e) {
    const id = this.getAttribute('href').slice(1);
    const el = document.getElementById(id);
    if (el) {
      e.preventDefault();
      el.scrollIntoView({behavior: 'smooth', block: 'start'});
    }
  });
});

// Back to top button click handler
document.getElementById('backTop').addEventListener('click', function() {
  window.scrollTo({top: 0, behavior: 'smooth'});
});
</script>
